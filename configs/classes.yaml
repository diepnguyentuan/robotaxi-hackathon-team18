# Fixed 11-class schema for AIInAction RoboTaxi Data-Centric Competition (Cohort 5)
# Order and IDs MUST NEVER BE CHANGED.
team_id: 23
imgsz: 640
min_gt_area_px: 64.0
min_train_instances: 100
max_imbalance_ratio: 30.0
min_gt_per_class_val: 10

classes:
  0: Car
  1: Bus
  2: Truck
  3: Other vehicle
  4: Motorcycle
  5: Motorcyclist
  6: Bicycle
  7: Cyclist
  8: Pedestrian
  9: Sign
  10: Traffic light

class_display_vi:
  Car: "Ô tô con"
  Bus: "Xe buýt / xe khách"
  Truck: "Xe tải"
  Other vehicle: "Phương tiện khác"
  Motorcycle: "Xe máy (không người)"
  Motorcyclist: "Xe máy (có người)"
  Bicycle: "Xe đạp (không người)"
  Cyclist: "Xe đạp (có người)"
  Pedestrian: "Người đi bộ"
  Sign: "Biển báo"
  Traffic light: "Đèn giao thông"

# Rare-class priority weights for selecting highest-value public images
rare_class_weights:
  0: 0.5   # Car
  1: 3.0   # Bus
  2: 2.0   # Truck
  3: 6.0   # Other vehicle (CRITICAL: ba gác, xích lô, rơ-moóc)
  4: 3.0   # Motorcycle (parked/unridden)
  5: 2.5   # Motorcyclist (combined)
  6: 5.0   # Bicycle (unridden)
  7: 6.0   # Cyclist (combined)
  8: 1.0   # Pedestrian
  9: 3.5   # Sign (front & back)
  10: 4.5  # Traffic light

# Indian Driving Dataset (IDD) polygon JSON label -> competition role
# Roles 'rider' are dynamically merged with nearest motorcycle/bicycle via Rider-Bike Union.
idd_mapping:
  car: 0
  bus: 1
  truck: 2
  autorickshaw: 3
  caravan: 3
  trailer: 3
  vehicle fallback: 3
  motorcycle: 4
  bicycle: 6
  person: 8
  rider: "rider"
  traffic sign: 9
  traffic light: 10

# Mapillary Vistas v1.2 / v2.0 label name -> competition role
mapillary_mapping:
  object--vehicle--car: 0
  object--vehicle--bus: 1
  object--vehicle--truck: 2
  object--vehicle--trailer: 3
  object--vehicle--wheeled-slow: 3
  object--vehicle--other-vehicle: 3
  object--vehicle--caravan: 3
  object--vehicle--motorcycle: 4
  object--vehicle--bicycle: 6
  human--person: 8
  human--person--individual: 8
  human--person--person-group: 8
  human--rider--motorcyclist: "motorcyclist_rider"
  human--rider--bicyclist: "bicyclist_rider"
  human--rider--other-rider: "rider"
  object--traffic-sign--front: 9
  object--traffic-sign--back: 9
  object--traffic-sign--information-parking: 9
  object--traffic-sign--temporary-front: 9
  object--traffic-sign--temporary-back: 9
  object--traffic-sign--direction-front: 9
  object--traffic-sign--direction-back: 9
  object--traffic-sign--ambiguous: 9
  object--traffic-light: 10
  object--traffic-light--general-upright: 10
  object--traffic-light--general-horizontal: 10
  object--traffic-light--general-single: 10
  object--traffic-light--pedestrians: 10
  object--traffic-light--cyclists: 10
  object--traffic-light--other: 10
